<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2854d9" />
    <meta
      name="description"
      content="Bilingual multi-agent research workspace powered by Gemini, Tavily, Wikipedia, and LangGraph."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexora — Không gian nghiên cứu AI</title>
    <script>
      try {
        const choice = localStorage.getItem('deep-research-appearance');
        const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch { /* Keep the default light appearance when storage is unavailable. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
