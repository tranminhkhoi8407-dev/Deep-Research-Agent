map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 25m;

    # Resolve the Compose service name at request time so API container
    # recreation does not leave Nginx pointing at an old container IP.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream api:8000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Do not preserve a client-supplied X-Forwarded-For value. The API rate
    # limiter uses the socket peer unless a trusted proxy is configured.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    # Never echo a protocol header supplied by an untrusted browser request.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;

    location = /health {
        proxy_pass http://$api_upstream$request_uri;
    }

    location = /api {
        proxy_pass http://$api_upstream$request_uri;
    }

    location ^~ /api/ {
        proxy_pass http://$api_upstream$request_uri;
    }

    location = /ws {
        proxy_pass http://$api_upstream$request_uri;
    }

    location ^~ /ws/ {
        proxy_pass http://$api_upstream$request_uri;
    }

    location = /docs {
        proxy_pass http://$api_upstream$request_uri;
    }

    location = /redoc {
        proxy_pass http://$api_upstream$request_uri;
    }

    location = /openapi.json {
        proxy_pass http://$api_upstream$request_uri;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
